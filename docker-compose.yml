services:
  give-me-job-please:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: give-me-job-please-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/give_me_job_please.db
      LOG_DIR: /app/data/logs
      FASTEMBED_CACHE_PATH: /app/data/model_cache
    volumes:
      - ./data:/app/data
    mem_limit: 1536m
    # Defense in depth: the bot never needs to gain privileges, spawn helpers,
    # or write outside /app/data and /tmp.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
      - /home/appuser/.cache:size=64m,noexec,nosuid
    pids_limit: 128
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sqlite3; p='/app/data/give_me_job_please.db'; assert os.path.exists(p); sqlite3.connect(p).execute('SELECT 1')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
